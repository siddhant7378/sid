<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 5px;
            margin: 5px 0;
            border: 1px solid #ccc;
        }
        button {
            background-color: #0074cc;
            color: #fff;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056a7;
        }
        p {
            font-weight: bold;
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>BMI Calculator</h1>
    <label for="weight">Weight (kg):</label>
    <input type="text" id="weight" placeholder="Enter your weight">
    <br>
    <label for="height">Height (m):</label>
    <input type="text" id="height" placeholder="Enter your height">
    <br>
    <button onclick="calculateBMI()">Calculate BMI</button>
    <p>Your BMI is: <span id="result"></span></p>

    <script>
        function calculateBMI() {
            var weight = parseFloat(document.getElementById("weight").value);
            var height = parseFloat(document.getElementById("height").value);
            
            if (isNaN(weight) || isNaN(height)) {
                alert("Please enter valid weight and height.");
                return;
            }
            
            var bmi = weight / (height * height);
            document.getElementById("result").textContent = bmi.toFixed(2);  // Display BMI with 2 decimal places
        }
    </script>
</body>
</html>
